[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-quantum-machine-learning-dashboard"
version = "1.0.0"
description = "A reproducible dashboard for explaining quantum feature encoding, circuit dynamics, gradients, and predictions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "School of AI and School of QC"}]
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "qiskit>=2.2,<3",
  "scikit-learn>=1.8,<1.9",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
notebook = ["jupyterlab>=4.3,<5"]

[project.scripts]
xqml-dashboard = "explainable_qml_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
